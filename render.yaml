services:
  - type: web
    name: foodsnap-django
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: foodsnap-django.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://foodsnap-react.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://foodsnap-react.onrender.com